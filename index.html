<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Essential Meta Tags -->
    <title>Campus Chapter - MuLearn</title>
    <meta name="description" content="Join MuLearn Campus Chapter - A community for learning, growth, and innovation. Connect with peers, participate in events, and enhance your skills." />
    <meta name="author" content="MuLearn" />
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="Campus Chapter - MuLearn" />
    <meta property="og:description" content="Join MuLearn Campus Chapter - A community for learning, growth, and innovation." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/Vector.png" />
    
    <!-- Mobile Meta Tags -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    
    <style>
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.3s ease-out;
        }

        #overlay::-webkit-scrollbar {
            display: none;
            color: white;
        }

        #overlay img {
            width: 300px;
            height: auto;
        }

        .progress {
            width: 100.8px;
            height: 16.8px;
            border-radius: 16.8px;
            background: repeating-linear-gradient(135deg, #FBBA16 0 8.4px, rgba(251, 186, 22, 0.5) 0 16.8px) left/0% 100% no-repeat,
                repeating-linear-gradient(135deg, rgba(71, 75, 255, 0.2) 0 8.4px, rgba(71, 75, 255, 0.1) 0 16.8px) left/100% 100%;
            animation: progress-p43u5e 2s infinite;
            will-change: background-size;
        }

        @keyframes progress-p43u5e {
            100% {
                background-size: 100% 100%;
            }
        }
    </style>
    <script>
        // Optimized loading overlay handler
        document.addEventListener('DOMContentLoaded', function() {
            const overlay = document.getElementById('overlay');
            if (overlay) {
                // Hide overlay after a shorter delay
                setTimeout(() => {
                    overlay.style.opacity = '0';
                    setTimeout(() => {
                        overlay.style.display = 'none';
                    }, 300);
                }, 500);
            }
        });
    </script>
</head>

<body>
    <div id="overlay" role="status" aria-label="Loading">
        <div class="progress" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</body>

</html>
